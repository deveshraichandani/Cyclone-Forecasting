<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyclone Prediction</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center">Cyclone Prediction</h2>

    <form method="POST" class="mb-5">
        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="year">Year</label>
                <select class="form-control" id="year" name="year">
                    {% for year in range(2020, 2041) %}
                        <option value="{{ year }}" {% if request.form['year'] and year == request.form['year']|int %}selected{% endif %}>{{ year }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    {% if predictions %}
        <h4 class="text-center">Predictions for {{ year }}</h4>
        <div class="table-responsive">
            {{ predictions|safe }}
        </div>
    {% else %}
        <p class="text-center">Please select a year to get the predictions.</p>
    {% endif %}
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
